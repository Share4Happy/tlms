# pg_hba.conf — TLMS
# Mounted by docker-compose so this file always wins over the copy inside the volume.
# This avoids "password authentication failed" errors on rebuilds with existing volumes.

# TYPE  DATABASE  USER    ADDRESS             METHOD

# Unix socket (local process-level)
local   all       all                         trust

# Localhost
host    all       all     127.0.0.1/32        trust
host    all       all     ::1/128             trust

# Docker internal networks (bridge ranges) — trusted, no password required
host    all       all     172.0.0.0/8         trust
host    all       all     192.168.0.0/16      trust

# Everything else (external) — require password
host    all       all     0.0.0.0/0           scram-sha-256
